name: UFLA Service Monitor CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install --only-binary=:all: -r requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@16ebe778df0e7752d2cfcbd924afdbbd89c1a755
        with:
          context: .
          push: true
          tags: |
            ghcr.io/viniciushabib90/ufla-service-monitor:latest
            ghcr.io/viniciushabib90/ufla-service-monitor:${{ github.sha }}

  deploy:
    name: Deploy Kubernetes and Nomad
    runs-on: [self-hosted, Linux, X64, ufla-deploy]
    needs: build
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          IMAGE="ghcr.io/viniciushabib90/ufla-service-monitor:${GITHUB_SHA}"

          sed "s|image: ufla-service-monitor:1.0|image: ${IMAGE}|" \
            k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/service.yaml

          kubectl rollout status deployment/ufla-service-monitor --timeout=180s

      - name: Deploy to Nomad
        run: |
          IMAGE="ghcr.io/viniciushabib90/ufla-service-monitor:${GITHUB_SHA}"

          sed "s|image        = \"ufla-service-monitor:1.0\"|image        = \"${IMAGE}\"|" \
            nomad/ufla-service-monitor.nomad > /tmp/ufla-service-monitor.nomad

          sed -i 's/force_pull   = false/force_pull   = true/' \
            /tmp/ufla-service-monitor.nomad

          nomad job run /tmp/ufla-service-monitor.nomad

          nomad job status ufla-service-monitor

      - name: Verify deployments
        run: |
          echo "=== Kubernetes ==="
          kubectl get deployments
          kubectl get pods
          kubectl get services

          echo "=== Nomad ==="
          nomad job status ufla-service-monitor
